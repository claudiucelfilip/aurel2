<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurel2 - Backtest</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 1.8rem; font-weight: 600; }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
        }
        nav a:hover { color: var(--text); }
        nav a.active { color: var(--accent); }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .controls {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input, select, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        button {
            background: var(--accent);
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .chart-container {
            position: relative;
            height: 500px;
            margin-top: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric {
            text-align: center;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .positive { color: var(--green); }
        .negative { color: var(--red); }

        .trades-table {
            width: 100%;
            border-collapse: collapse;
        }

        .trades-table th, .trades-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .trades-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .trade-buy { color: var(--green); }
        .trade-sell { color: var(--red); }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 16px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-portfolio { background: var(--accent); }
        .legend-benchmark { background: var(--text-muted); }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 40px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Aurel2</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/backtest" class="active">Backtest</a>
                <a href="/settings">Settings</a>
            </nav>
        </header>

        <!-- Controls -->
        <div class="card">
            <div class="controls">
                <div class="control-group">
                    <label>Start Date</label>
                    <input type="date" id="start-date" value="2010-01-01">
                </div>
                <div class="control-group">
                    <label>End Date</label>
                    <input type="date" id="end-date" value="{{ today.isoformat() }}">
                </div>
                <div class="control-group">
                    <label>Initial Capital</label>
                    <input type="number" id="capital" value="10000" step="1000">
                </div>
                <div class="control-group">
                    <label>&nbsp;</label>
                    <button id="run-backtest" onclick="runBacktest()">Run Backtest</button>
                </div>
            </div>
        </div>

        <!-- Metrics -->
        <div class="card" id="metrics-card" style="display: none;">
            <div class="card-title">Performance Metrics</div>
            <div class="metrics-grid" id="metrics-grid">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Chart -->
        <div class="card">
            <div class="card-title">Portfolio Value vs S&P 500</div>
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Running backtest...</p>
            </div>
            <div class="chart-container">
                <canvas id="backtest-chart"></canvas>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color legend-portfolio"></div>
                    <span>Dual Momentum Strategy</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-benchmark"></div>
                    <span>S&P 500 Buy & Hold</span>
                </div>
            </div>
        </div>

        <!-- Trades -->
        <div class="card" id="trades-card" style="display: none;">
            <div class="card-title">Trade History</div>
            <table class="trades-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Action</th>
                        <th>Symbol</th>
                        <th>Price</th>
                        <th>Value</th>
                        <th>Reason</th>
                    </tr>
                </thead>
                <tbody id="trades-tbody">
                    <!-- Filled by JS -->
                </tbody>
            </table>
        </div>

        <footer>
            Aurel2 · Tax-Optimized Dual Momentum
        </footer>
    </div>

    <script>
        let chart = null;

        async function runBacktest() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const capital = document.getElementById('capital').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('run-backtest').disabled = true;

            try {
                const response = await fetch(`/api/backtest?start=${startDate}&end=${endDate}&capital=${capital}`);
                const data = await response.json();

                renderMetrics(data.metrics, data);
                renderChart(data);
                renderTrades(data.trades, data.signals);

                document.getElementById('metrics-card').style.display = 'block';
                document.getElementById('trades-card').style.display = 'block';
            } catch (error) {
                console.error('Backtest failed:', error);
                alert('Backtest failed. Check console for details.');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('run-backtest').disabled = false;
            }
        }

        function renderMetrics(metrics, data) {
            const grid = document.getElementById('metrics-grid');
            grid.innerHTML = `
                <div class="metric">
                    <div class="metric-value ${metrics.total_return >= 0 ? 'positive' : 'negative'}">
                        ${metrics.total_return.toFixed(1)}%
                    </div>
                    <div class="metric-label">Total Return</div>
                </div>
                <div class="metric">
                    <div class="metric-value ${metrics.cagr >= 0 ? 'positive' : 'negative'}">
                        ${metrics.cagr.toFixed(1)}%
                    </div>
                    <div class="metric-label">CAGR</div>
                </div>
                <div class="metric">
                    <div class="metric-value negative">
                        -${metrics.max_drawdown.toFixed(1)}%
                    </div>
                    <div class="metric-label">Max Drawdown</div>
                </div>
                <div class="metric">
                    <div class="metric-value">
                        ${metrics.sharpe_ratio.toFixed(2)}
                    </div>
                    <div class="metric-label">Sharpe Ratio</div>
                </div>
                <div class="metric">
                    <div class="metric-value">
                        ${metrics.num_trades}
                    </div>
                    <div class="metric-label">Trades</div>
                </div>
                <div class="metric">
                    <div class="metric-value ${metrics.benchmark_return >= 0 ? 'positive' : 'negative'}">
                        ${metrics.benchmark_return.toFixed(1)}%
                    </div>
                    <div class="metric-label">S&P 500 Return</div>
                </div>
                <div class="metric">
                    <div class="metric-value ${metrics.alpha >= 0 ? 'positive' : 'negative'}">
                        ${metrics.alpha >= 0 ? '+' : ''}${metrics.alpha.toFixed(1)}%
                    </div>
                    <div class="metric-label">Alpha vs S&P</div>
                </div>
                <div class="metric">
                    <div class="metric-value">
                        $${data.final_value.toLocaleString()}
                    </div>
                    <div class="metric-label">Final Value</div>
                </div>
            `;
        }

        function renderChart(data) {
            const ctx = document.getElementById('backtest-chart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            // Prepare data
            const portfolioData = data.portfolio.map(p => ({
                x: new Date(p.date),
                y: p.value
            }));

            // Sample benchmark to reduce points
            const benchmarkData = data.benchmark
                .filter((_, i) => i % 20 === 0)  // Every 20th point
                .map(p => ({
                    x: new Date(p.date),
                    y: p.value
                }));

            // Trade markers
            const buyPoints = data.trades
                .filter(t => t.action === 'BUY')
                .map(t => {
                    const portfolioPoint = data.portfolio.find(p => p.date === t.date);
                    return {
                        x: new Date(t.date),
                        y: portfolioPoint ? portfolioPoint.value : t.value,
                        symbol: t.symbol
                    };
                });

            const sellPoints = data.trades
                .filter(t => t.action === 'SELL')
                .map(t => {
                    const portfolioPoint = data.portfolio.find(p => p.date === t.date);
                    return {
                        x: new Date(t.date),
                        y: portfolioPoint ? portfolioPoint.value : t.value,
                        symbol: t.symbol
                    };
                });

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Dual Momentum',
                            data: portfolioData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.1,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                        {
                            label: 'S&P 500',
                            data: benchmarkData,
                            borderColor: '#94a3b8',
                            backgroundColor: 'transparent',
                            borderDash: [5, 5],
                            tension: 0.1,
                            pointRadius: 0,
                            borderWidth: 2,
                        },
                        {
                            label: 'Buy',
                            data: buyPoints,
                            type: 'scatter',
                            backgroundColor: '#22c55e',
                            borderColor: '#22c55e',
                            pointRadius: 8,
                            pointStyle: 'triangle',
                        },
                        {
                            label: 'Sell',
                            data: sellPoints,
                            type: 'scatter',
                            backgroundColor: '#ef4444',
                            borderColor: '#ef4444',
                            pointRadius: 8,
                            pointStyle: 'triangle',
                            rotation: 180,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: false,
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.dataset.label === 'Buy' || context.dataset.label === 'Sell') {
                                        return `${context.dataset.label}: ${context.raw.symbol}`;
                                    }
                                    return `${context.dataset.label}: $${context.parsed.y.toLocaleString()}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'year',
                                displayFormats: {
                                    year: 'yyyy'
                                }
                            },
                            grid: {
                                color: '#334155',
                            },
                            ticks: {
                                color: '#94a3b8',
                            }
                        },
                        y: {
                            grid: {
                                color: '#334155',
                            },
                            ticks: {
                                color: '#94a3b8',
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderTrades(trades, signals) {
            const tbody = document.getElementById('trades-tbody');

            // Combine trades with signal reasons
            const signalMap = {};
            signals.forEach(s => {
                signalMap[s.date] = s;
            });

            tbody.innerHTML = trades.map(t => {
                const signal = signalMap[t.date];
                const reason = signal ? signal.reason : '';

                return `
                    <tr>
                        <td>${t.date}</td>
                        <td class="trade-${t.action.toLowerCase()}">${t.action}</td>
                        <td>${t.symbol}</td>
                        <td>$${t.price.toFixed(2)}</td>
                        <td>$${t.value.toLocaleString()}</td>
                        <td style="max-width: 400px; font-size: 0.85rem; color: var(--text-muted);">${reason}</td>
                    </tr>
                `;
            }).join('');
        }

        // Run initial backtest on page load
        document.addEventListener('DOMContentLoaded', () => {
            runBacktest();
        });
    </script>
</body>
</html>
