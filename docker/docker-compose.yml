name: aurel2-trading

services:
  # Aurel2 Trading Daemon
  aurel2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      # Alpaca credentials
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}

      # Trading settings (read by CLI via envvar)
      TRADING_MODE: ${TRADING_MODE:-paper}
      CHECK_TIME: ${CHECK_TIME:-16:00}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      DRY_RUN: ${DRY_RUN:-false}
      NTFY_TOPIC: ${NTFY_TOPIC:-aurel2}

      # AI settings
      AI_MODEL: ${AI_MODEL:-sonnet}
      AI_LOOKBACK_YEARS: ${AI_LOOKBACK_YEARS:-3}

    volumes:
      # Persist aurel2 data (portfolio, logs, pending orders)
      - aurel2-data:/root/.aurel2

      # Persist mode-partitioned trade journal / pending decisions / session
      # progress across container rebuilds. Without this, deploys wipe the
      # paper/live track records (see 2026-05-07 incident).
      - ../data/paper:/app/data/paper
      - ../data/live:/app/data/live
      - ../data/archive:/app/data/archive

      # Keep runtime code/config in sync with host checkout (no image drift)
      - ../src:/app/src:ro
      - ../config:/app/config:ro

      # Claude Code auth (mount from host - needs to be writable for CLI)
      - ${CLAUDE_CONFIG_PATH:-./claude-config}:/root/.claude
    # Command uses environment variables via typer's envvar support
    command: ["live", "--paper"]

  # Daemon Monitor - watches health and auto-recovers
  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      aurel2:
        condition: service_healthy
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC:-aurel2}
    volumes:
      # Share aurel2 data volume to read heartbeat file
      - aurel2-data:/root/.aurel2

      # Keep monitor code/config in sync with host checkout
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    command: ["monitor", "--paper"]

  # Dashboard (optional web UI)
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - aurel2
    environment:
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
    volumes:
      - aurel2-data:/root/.aurel2
      # Writable: dashboard hosts the local approval UI and writes status
      # changes back to data/{mode}/pending_decisions.json. Daemon picks up
      # via the disk-edit path in src/aurel2/live/pending.py.
      - ../data:/app/host-data
      # Bind-mount source + config for hot reload
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    profiles:
      - dashboard

  # Weekly fidelity guard — replays recent live decisions through the backtest
  # engine and alerts via ntfy on divergence. NOT scheduled by this file; the
  # `fidelity-guard` profile means `docker compose up` never starts it. Wire
  # it to a real schedule with an external cron entry, e.g. on the host:
  #   0 6 * * 1 cd /opt/aurel2 && docker compose --profile fidelity-guard run --rm fidelity-guard
  # (Monday 06:00, before the Monday pre-open overlay cadence.) Track A only
  # adds the wiring — activating it on any host is explicitly out of scope.
  fidelity-guard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC:-aurel2}
      TRADING_MODE: ${TRADING_MODE:-paper}
    volumes:
      - ../data/paper:/app/data/paper:ro
      - ../data/live:/app/data/live:ro
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
    entrypoint: ["python3", "scripts/fidelity_guard.py"]
    command: ["--mode", "${TRADING_MODE:-paper}", "--days", "10", "--ntfy-topic", "${NTFY_TOPIC:-aurel2}"]
    profiles:
      - fidelity-guard

  # Weekly overlay runner — assembles the frozen context pack from the SAME
  # live decision path checker.py uses and calls the majority-of-5 overlay
  # runner to write+auto-commit a fresh data/{mode}/overlay_tilt.json. NOT
  # scheduled by this file; the `overlay-runner` profile means `docker
  # compose up` never starts it. Track E only adds the wiring — activating it
  # on any host, and flipping CANONICAL_CONFIG.overlay.enabled to True, are
  # both explicitly out of scope for this change. Intended host cron entry
  # (Monday pre-open ET, i.e. before 09:30 ET / after the weekend):
  #   30 8 * * 1 cd /opt/aurel2 && docker compose --profile overlay-runner run --rm overlay-runner
  # (08:30 ET Monday — an hour and a half before pre-open, leaving room to
  # investigate before the daemon's own pre-open check reads the tilt.)
  overlay-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      AI_MODEL: ${OVERLAY_MODEL:-claude-fable-5}
    volumes:
      # Writable: this job's whole job is to write overlay_tilt.json (git-
      # auto-committed) and overlay_state.json. Read access to the trade
      # journal to determine current holding.
      - ../data/paper:/app/data/paper
      - ../data/live:/app/data/live
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
      # Claude Code CLI auth (majority-of-5 sampling shells out to `claude`).
      - ${CLAUDE_CONFIG_PATH:-./claude-config}:/root/.claude
    entrypoint: ["python3", "scripts/run_weekly_overlay.py"]
    command: ["--mode", "${TRADING_MODE:-paper}"]
    profiles:
      - overlay-runner

  # Daily event-trigger check — pure predicate: has the held asset moved
  # >5% in 3 days? If so, exits 3 so the host cron entry can chain into an
  # out-of-cadence overlay-runner invocation. NOT scheduled by this file.
  # Intended host cron entry (daily, before market open, any day the weekly
  # runner above didn't already just run):
  #   0 8 * * 1-5 cd /opt/aurel2 && \
  #     docker compose --profile overlay-event-check run --rm overlay-event-check; \
  #     [ $? -eq 3 ] && docker compose --profile overlay-runner run --rm overlay-runner
  # (08:00 ET every weekday. Exit code 3 = triggered, chains into the same
  # overlay-runner service above; exit 0 = no-op, nothing chains.)
  overlay-event-check:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
    volumes:
      - ../data/paper:/app/data/paper:ro
      - ../data/live:/app/data/live:ro
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
    entrypoint: ["python3", "scripts/run_weekly_overlay.py"]
    command: ["--mode", "${TRADING_MODE:-paper}", "--check-event-trigger-only"]
    profiles:
      - overlay-event-check

  # Weekly scorecard — the automated parallel-run referee (A2+overlay vs
  # live-trader vs A2-bare shadow replay vs QQQ). Appends to
  # data/{mode}/scorecard_history.jsonl, writes scorecard_latest.json for the
  # dashboard, sends an ntfy summary. NOT scheduled by this file; the
  # `weekly-scorecard` profile means `docker compose up` never starts it.
  # --run-start is intentionally NOT defaulted here — see
  # docs/plans/2026-07-10-graduation-rule.md section 0: the run-start date is
  # stamped at launch, not invented. Whoever activates this cron entry must
  # fill it in. Intended host cron entry (Friday after close ET):
  #   0 17 * * 5 cd /opt/aurel2 && docker compose --profile weekly-scorecard run --rm \
  #     -e RUN_START=<run-start-date> weekly-scorecard
  weekly-scorecard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
      NTFY_TOPIC: ${NTFY_TOPIC:-aurel2}
      # RUN_START must be set to the run's stamped start date (e.g. 2026-07-14)
      # -- see docs/plans/2026-07-10-graduation-rule.md section 0. Not defaulted
      # on purpose: an invented date would silently corrupt every Sharpe/DD
      # number this script computes.
      RUN_START: ${RUN_START:?set RUN_START, see docker-compose.yml comment above}
    volumes:
      # Writable: appends scorecard_history.jsonl, writes scorecard_latest.json.
      - ../data/paper:/app/data/paper
      - ../data/live:/app/data/live
      - ../src:/app/src:ro
      - ../config:/app/config:ro
      - ../scripts:/app/scripts:ro
      # live-trader arm (READ-ONLY): mounted at the same absolute path the
      # script reads (weekly_scorecard.py::LIVE_TRADER_TRADES_PATH). Verified
      # present on Dumbo 2026-07-10. If the mount is absent the arm reports a
      # data gap per the graduation rule §5 -- never a crash.
      - /Users/claudiu/.openclaw/workspace/live-trader:/Users/claudiu/.openclaw/workspace/live-trader:ro
    entrypoint: ["python3", "scripts/weekly_scorecard.py"]
    command: ["--mode", "${TRADING_MODE:-paper}", "--run-start", "${RUN_START}", "--ntfy-topic", "${NTFY_TOPIC:-aurel2}"]
    profiles:
      - weekly-scorecard

volumes:
  aurel2-data:
